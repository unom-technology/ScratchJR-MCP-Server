<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScratchJr - Log in</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<main class="card">
  <img class="logo" src="/app/assets/lobby/scratchJrlogo.svg" alt="ScratchJr">

  <div class="tabs" role="tablist">
    <button type="button" class="tab on" id="tab-login" role="tab" aria-selected="true">Log in</button>
    <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false">New student</button>
  </div>

  <form id="form" novalidate>
    <p class="notice" id="notice" hidden></p>

    <div id="student-rows" hidden>
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullname" autocomplete="name" maxlength="80">

      <label for="grade">Grade</label>
      <select id="grade" name="grade">
        <option value="">Pick your grade</option>
        <option value="1">Grade 1</option>
        <option value="2">Grade 2</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>
      <p class="field-note">Your teacher puts you in your section.</p>
    </div>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>

    <div id="confirm-row" hidden>
      <label for="confirm">Type the password again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="200">
    </div>

    <p class="error" id="error" role="alert" hidden></p>

    <button type="submit" class="go" id="submit">Log in</button>
  </form>

  <p class="hint" id="hint">Forgot your password? Ask your teacher.</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
