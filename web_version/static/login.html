<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScratchJr - Log in</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<main class="card">
  <img class="logo" src="/app/assets/lobby/scratchJrlogo.svg" alt="ScratchJr">

  <div class="tabs" role="tablist">
    <button type="button" class="tab on" id="tab-login" role="tab" aria-selected="true">Log in</button>
    <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false">New student</button>
  </div>

  <form id="form" novalidate>
    <p class="notice" id="notice" hidden></p>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>

    <div id="confirm-row" hidden>
      <label for="confirm">Type the password again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="200">
    </div>

    <p class="error" id="error" role="alert" hidden></p>

    <button type="submit" class="go" id="submit">Log in</button>
  </form>

  <p class="hint" id="hint">Forgot your password? Ask your teacher.</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
